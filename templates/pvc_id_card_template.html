<!-- IES SCHOOL ERP - PVC STUDENT IDENTITY CARD TEMPLATE -->
<div class="id-card" style="width: 320px; height: 200px; border: 2px solid #1e3a8a; border-radius: 10px; padding: 12px; font-family: sans-serif; font-size: 11px; background: #fff; color: #000; position: relative;">
  <div style="text-align: center; border-bottom: 2px solid #1e3a8a; padding-bottom: 4px;">
    <div style="font-weight: 800; color: #1e3a8a; font-size: 13px;">IDEAL ENGLISH SCHOOL</div>
    <div style="font-size: 9px; color: #555;">Dholai Bazaar, Cachar, Assam &middot; Estd: 1989</div>
  </div>
  <div style="display: flex; gap: 10px; margin-top: 10px;">
    <div style="width: 70px; height: 85px; border: 1px solid #999; display: flex; align-items: center; justify-content: center; font-size: 10px;">Photo</div>
    <div style="line-height: 1.6;">
      <div>Name: <b>{{STUDENT_NAME}}</b></div>
      <div>Class: <b>Class {{CLASS}} - {{SECTION}}</b></div>
      <div>Roll: <b>#{{ROLL}}</b> &middot; Blood: <b>{{BLOOD_GROUP}}</b></div>
      <div>Contact: <b>{{PHONE}}</b></div>
    </div>
  </div>
  <div style="position: absolute; bottom: 8px; left: 12px; right: 12px; display: flex; justify-content: space-between; font-size: 9px;">
    <div>Session: 2026&ndash;27</div>
    <div>Principal Signature</div>
  </div>
</div>
